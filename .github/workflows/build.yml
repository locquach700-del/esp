name: Build ESP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          ls $ANDROID_HOME/build-tools/

      - name: Setup Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew \
            -o gradlew
          chmod +x gradlew
          curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/

      - name: Copy patch assets
        run: |
          mkdir -p app/src/main/assets
          cp leomodzdev_esp.dat app/src/main/assets/
          echo '{"testCodePatch":true,"resetGuest":true}' > app/src/main/assets/localConfig.json
          ls app/src/main/assets/

      - name: Generate launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          python3 -c "
          import struct, zlib
          def make_png(size, color):
              def chunk(t, d):
                  c = zlib.crc32(t+d) & 0xffffffff
                  return struct.pack('>I',len(d)) + t + d + struct.pack('>I',c)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB',size,size,8,2,0,0,0))
              r,g,b = color
              row = b'\x00' + bytes([r,g,b]*size)
              raw = row * size
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          with open('app/src/main/res/mipmap-hdpi/ic_launcher.png','wb') as f:
              f.write(make_png(72, (21,101,192)))
          print('icon ok')
          "

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/

      - name: Sign APK
        run: |
          keytool -genkey -v \
            -keystore sign.keystore -alias app \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass esp1234 -keypass esp1234 \
            -dname "CN=ESP,OU=ESP,O=ESP,L=HN,S=HN,C=VN"

          apksigner sign \
            --ks sign.keystore \
            --ks-pass pass:esp1234 \
            --key-pass pass:esp1234 \
            --ks-key-alias app \
            --out ESP_FF_SIGNED.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

          ls -lh ESP_FF_SIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP_FF_APK
          path: ESP_FF_SIGNED.apk
          retention-days: 7
